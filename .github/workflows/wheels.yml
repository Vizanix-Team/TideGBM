name: wheels

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: cibuildwheel-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        run: pip install cibuildwheel
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: 'bash "{project}/scripts/repair_macos_wheel.sh" "{wheel}" "{dest_dir}" "{delocate_archs}"'
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
