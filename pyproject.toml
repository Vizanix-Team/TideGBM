[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "tidegbm"
version = "0.5.0"
description = "Temporal ordered gradient boosting for panel and market data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Vizanix" }]
keywords = [
    "gradient-boosting",
    "time-series",
    "panel-data",
    "quant",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
onnx = ["onnx>=1.16"]
bench = ["lightgbm>=4.0", "catboost>=1.2"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Vizanix-Team/TideGBM"
Documentation = "https://github.com/Vizanix-Team/TideGBM/blob/main/docs/API.md"
Repository = "https://github.com/Vizanix-Team/TideGBM"
Issues = "https://github.com/Vizanix-Team/TideGBM/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-*"
skip = "*-win32 *-manylinux_i686 *-musllinux*"
before-build = "pip install pybind11"
test-requires = ["pytest", "numpy", "pandas", "scikit-learn"]
test-command = "python -m pytest {project}/tests -q -o pythonpath="

[tool.cibuildwheel.macos]
before-all = "export HOMEBREW_NO_REQUIRE_TAP_TRUST=1 && brew install libomp"
repair-wheel-command = "bash \"{project}/scripts/repair_macos_wheel.sh\" \"{wheel}\" \"{dest_dir}\" \"{delocate_archs}\""

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"
ARCHFLAGS = "-arch arm64"
