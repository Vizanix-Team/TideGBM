[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "tidegbm"
version = "0.4.0"
description = "Temporal ordered gradient boosting for panel and market data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Vizanix" }]
keywords = [
    "gradient-boosting",
    "time-series",
    "panel-data",
    "quant",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
fast = ["numba>=0.59"]
onnx = ["onnx>=1.16"]
bench = ["lightgbm>=4.0", "catboost>=1.2"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Vizanix/TideGBM"
Documentation = "https://github.com/Vizanix/TideGBM/blob/main/docs/API.md"
Repository = "https://github.com/Vizanix/TideGBM"
Issues = "https://github.com/Vizanix/TideGBM/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
